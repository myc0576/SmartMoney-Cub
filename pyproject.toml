[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartmoney-cub-harness"
dynamic = ["version"]
description = "A read-only trading companion harness for decision logging, outcome review, and rule evolution."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "smartmoney-cub-harness contributors" }]
keywords = [
  "agent-harness",
  "agent-loop",
  "self-evolving-agent",
  "human-in-the-loop",
  "decision-review",
  "trading-journal",
  "subjective-trading",
  "semi-quant",
  "rule-evolution",
  "mcp",
  "skills",
  "context-engineering",
  "workflow-engineering",
  "read-only",
  "decision-log",
  "backtesting",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
hosted = ["psycopg[binary]>=3.2"]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.17", "pypdfium2>=4.30", "pypdf>=4.0"]
pdf = ["pypdf>=4.0"]

[project.scripts]
smcub = "smartmoney_cub_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smartmoney_cub_harness = [
  "data/*.json",
  "dashboard/templates/*.html",
  "trader/storage/*.sql",
  "workbench/web/*.html",
  # The favicon is copied to the web root by the interface build, so it needs its
  # own pattern: 'web/assets/*' does not match it, and an installed copy would
  # serve a missing icon.
  "workbench/web/*.png",
  "workbench/web/assets/*",
]

[tool.setuptools.dynamic]
version = { attr = "smartmoney_cub_harness.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:dash --ignore-glob=*冲突文件*"
