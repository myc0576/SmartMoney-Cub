# The hosted trader product: the app plus its Postgres 16 tenant store.
#
# Secrets do not live in this file. Every value below is read from the
# environment, so the same file works for a laptop, a staging host, and a
# production host, and the credentials stay in the shell or in an .env file
# that is never committed. The top-level `name` key is the Compose
# Specification form; `version` is deliberately absent because current
# Compose releases treat it as obsolete.
#
# Run from the repository root so the build context includes the package:
#
#     export POSTGRES_PASSWORD=... TRADER_ACCESS_TOKEN=...
#     docker compose -f deploy/docker-compose.yml up --build

name: smartmoney-cub-trader

services:
  db:
    # Postgres 16: the major version the hosted store is tested against.
    image: postgres:16
    restart: unless-stopped
    environment:
      # The role and database names are fixed with a default so the app's URL
      # can be derived from the same variables; only the password is secret.
      POSTGRES_USER: ${POSTGRES_USER:-smcub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-smcub}
      # Deterministic collation, so a tenant's row ordering does not depend on
      # how the image happened to be built.
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
    volumes:
      # A named volume, so the journal survives `down` and image rebuilds.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # The app waits for this to pass before it starts, so it never races an
      # initializing database.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # The database is reachable only inside the compose network. Publishing it
    # is a deliberate debugging act, not the default.
    expose:
      - "5432"

  app:
    build:
      # The build context is the repository root, one level above this file.
      context: ..
      dockerfile: deploy/Dockerfile
    image: smartmoney-cub-trader:1.0.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Hosted mode requires a postgres URL and refuses to fall back to a local
      # file, so this is mandatory rather than defaulted.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-smcub}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-smcub}}
      # Required because the server binds 0.0.0.0; it refuses to start without
      # a token. Clients send it as the X-SMCUB-Token header.
      TRADER_ACCESS_TOKEN: ${TRADER_ACCESS_TOKEN:?TRADER_ACCESS_TOKEN is required}
      TRADER_PORT: ${TRADER_PORT:-8787}
      # Identity for hosted requests. `session` forwards the caller's platform
      # cookie; `hmac` verifies a signed header and needs the shared secret.
      ALPHATECH_AUTH_MODE: ${ALPHATECH_AUTH_MODE:-session}
      ALPHATECH_BASE_URL: ${ALPHATECH_BASE_URL:-https://alphatech.net.cn}
      # Absent in hmac mode means fail-closed: every request is refused with
      # 401 instead of being served as an anonymous tenant.
      ALPHATECH_SSO_SECRET: ${ALPHATECH_SSO_SECRET:-}
    volumes:
      # The workbench keeps assistant sessions and settings on disk. The journal
      # itself is in Postgres, so this volume is small and disposable.
      - smcub_state:/var/lib/smcub
    ports:
      # Loopback by default: put nginx (deploy/nginx.conf) in front for TLS and
      # the /trader prefix, and avoid publishing this port directly.
      - "${TRADER_BIND:-127.0.0.1}:${TRADER_PORT:-8787}:${TRADER_PORT:-8787}"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request;
          req=urllib.request.Request('http://127.0.0.1:'+os.environ.get('TRADER_PORT','8787')+'/',headers={'X-SMCUB-Token':os.environ.get('TRADER_ACCESS_TOKEN','')});
          urllib.request.urlopen(req, timeout=4)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  # The tenant journal. Back this up: it is the user's own data, and it is not
  # in the repository.
  db_data:
  # The workbench's local state.
  smcub_state:
