# Reverse proxy for the hosted trader product.
#
# Why the product sits behind a prefix: the product is a peer entry on the
# alphatech platform, so it is published as https://alphatech.net.cn/trader
# alongside Alpha Canvas and the Commerce Workbench, not as its own host.
#
# This file is a complete nginx configuration, so it can be tested on its own
# with:
#
#     nginx -t -c deploy/nginx.conf
#
# On a distribution nginx, copy the two `server` blocks (and the `map`) into
# /etc/nginx/conf.d/trader.conf and drop this file's `events` and `http`
# wrappers.
#
# The placeholder values to replace before this serves real traffic:
#   * server_name            - the real hostname
#   * ssl_certificate        - the TLS certificate chain
#   * ssl_certificate_key    - the TLS private key
#   * ssl_trusted_certificate- the issuer chain used for OCSP stapling
#   * ssl_dhparam            - only if the deployment pins its own DH params
# Nothing here carries a secret in the clear; the token and the database URL
# stay with the app process.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ---- WebSocket / connection upgrade plumbing ------------------------
    #
    # The app's workbench streams the review assistant's turns as
    # Server-Sent Events over a single long-lived HTTP/1.1 response, not as a
    # WebSocket. The map is kept because (a) a browser or an intermediary may
    # still open an upgrade for a streaming endpoint, and (b) a future
    # realtime surface can use it without a second edit. A connection that
    # does not ask for an upgrade gets an empty Connection header, which is
    # what keeps keep-alive working.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Long enough that a slow assistant turn is not cut off mid-stream; the
    # app's own turn timeout is the thing that should end a stalled stream.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    upstream smcub_trader {
        # The app on the same host, as produced by deploy/trader.service.
        server 127.0.0.1:8787;
        # When the app runs in the compose file instead, use the service name:
        #   server app:8787;
        keepalive 16;
    }

    # ---- HTTP: redirect everything to TLS -------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name trader.example.com;

        # Certbot's HTTP-01 challenge is answered over plain HTTP.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS: the product under the /trader prefix --------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name trader.example.com;

        # --- TLS placeholders: replace all four before serving traffic ---
        ssl_certificate     /etc/nginx/certs/trader.example.com.fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/trader.example.com.key;
        ssl_trusted_certificate /etc/nginx/certs/trader.example.com.chain.pem;
        # ssl_dhparam /etc/nginx/certs/dhparam.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # The interface loads no third-party asset and no remote font, so the
        # policy can be tight. 'unsafe-inline' covers the boot script inside
        # the shell that applies the stored light/dark preference before first
        # paint.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

        # Uploads are broker exports and screenshots, which a parser reads on
        # the machine. A few tens of megabytes is generous; nginx stops a body
        # larger than this rather than letting the app buffer it.
        client_max_body_size 32m;

        # The product is published under /trader. The trailing slash on both
        # the location and proxy_pass is load-bearing: it rewrites
        # /trader/api/trader/health to /api/trader/health, which is the path
        # the app serves. The built interface uses relative asset URLs, so it
        # works unchanged behind the prefix.
        location /trader/ {
            proxy_pass http://smcub_trader/;
            proxy_http_version 1.1;

            # nginx holds the access token so the browser never has to. A browser
            # cannot attach a custom header to the navigation that loads a page or
            # to the requests the page then makes for its own JavaScript and CSS,
            # so a token-protected app is unreachable from a browser unless the
            # proxy supplies the header. The token still does its job: it is what
            # keeps the app's port from being an open journal if anything else on
            # this host can reach it.
            #
            # The value comes from an include so the secret stays out of this
            # repository and out of the config file's history:
            #
            #     printf 'set $smcub_token "%s";\n' "$(openssl rand -hex 32)" \
            #         | sudo tee /etc/nginx/snippets/smcub-token.conf >/dev/null
            #     sudo chmod 600 /etc/nginx/snippets/smcub-token.conf
            #
            # The same value goes in the service's TRADER_ACCESS_TOKEN. A missing
            # include makes nginx refuse to start, which is the right failure: a
            # proxy that came up without the token would 401 every request.
            include /etc/nginx/snippets/smcub-token.conf;
            proxy_set_header X-SMCUB-Token $smcub_token;

            # Standard forwarding headers. The app resolves the caller's
            # alphatech identity from the session cookie, which is forwarded
            # unchanged below.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /trader;

            # Connection upgrade, for the SSE stream and any future WebSocket.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Server-Sent Events must arrive as they are produced. Buffering
            # would hold the assistant's turn until the whole stream finished,
            # which is the difference between a live reply and a frozen page.
            proxy_buffering off;
            proxy_cache off;
            proxy_request_buffering off;
            chunked_transfer_encoding on;
            add_header X-Accel-Buffering no always;
        }

        # '/trader' without the trailing slash would otherwise match no
        # location and fall through to the default 404.
        location = /trader {
            return 301 https://$host/trader/;
        }

        # ---- Trust boundary -------------------------------------------
        #
        # '/trader/api/trader/*' resolves an alphatech identity on every
        # request, so it is safe to publish. The rest of the app's API
        # ('/api/overview', '/api/settings', '/api/assistant/*', ...) is the
        # local single-user review workbench: it carries no tenant identity
        # and reads the container's own state directory.
        #
        # These two blocks are ACTIVE, and that is deliberate. The proxy injects
        # the access token for every visitor, because a browser cannot send a
        # custom header on a page load, so the token does not distinguish one
        # person from another. Gating the workbench surface on the token alone
        # therefore let any visitor the proxy served read the container's shared
        # state directory -- including another user's assistant sessions, which
        # was confirmed by driving a real deployment with two identities.
        #
        # Fail closed, opt into the wider surface. The two blocks take over the
        # API paths while '/trader/' keeps serving the interface and its assets,
        # because nginx picks the longest matching prefix. Deleting the
        # '/trader/' block would leave the product with no page to load.
        #
        # To run the local review panels (settings, plugins, the assistant) on a
        # host that serves ONE person and is not reachable by anyone else, comment
        # both blocks out. On a shared host, leave them as they are: those panels
        # read one shared directory and carry no tenant identity, so publishing
        # them shows every user the same data.
        location ^~ /trader/api/trader/ {
            proxy_pass http://smcub_trader/api/trader/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /trader;
            include /etc/nginx/snippets/smcub-token.conf;
            proxy_set_header X-SMCUB-Token $smcub_token;
            proxy_buffering off;
            proxy_cache off;
            add_header X-Accel-Buffering no always;
        }

        location ^~ /trader/api/ {
            return 403;
        }

        location / {
            return 404;
        }
    }
}
