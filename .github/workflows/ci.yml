name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      - name: Doctor
        run: smcub doctor

      - name: Loop demo English
        run: smcub loop --preset toy --agent-trigger "loop"

      - name: Loop demo Chinese
        run: smcub loop --preset toy --agent-trigger "自进化"

      - name: Plugin contract doctor
        run: |
          smcub plugin inspect examples/toy_plugin/plugin.json
          smcub plugin doctor --plugin-dir examples/toy_plugin --state-db "$RUNNER_TEMP/plugins.db"
          smcub profile show a-share-review
          smcub plugin catalog

      - name: Plugin run wraps evidence and blocks future data
        run: |
          printf '%s' '{"symbol":"600111","return_pct":-8.5}' > "$RUNNER_TEMP/request.json"
          smcub plugin run toy.review-tagger \
            --request "$RUNNER_TEMP/request.json" \
            --decision-time 2026-09-10T15:00:00+08:00 \
            --available-at  2026-09-10T14:00:00+08:00 \
            --plugin-dir examples/toy_plugin \
            --state-db "$RUNNER_TEMP/plugins.db" > "$RUNNER_TEMP/envelope.json"
          python -c "import json,sys; d=json.load(open('$RUNNER_TEMP/envelope.json')); assert d['status']=='ok', d; e=d['envelope']; assert e['review_only'] and e['champion_mutated'] is False and e['permission']['order'] is False"
          if smcub plugin run toy.review-tagger \
              --decision-time 2026-09-10T15:00:00+08:00 \
              --available-at  2026-09-11T15:00:00+08:00 \
              --plugin-dir examples/toy_plugin \
              --state-db "$RUNNER_TEMP/plugins.db"; then
            echo "future leakage was not blocked" >&2
            exit 1
          fi

      - name: Plugin install refuses remote sources
        run: |
          if smcub plugin install https://github.com/akfamily/akshare --state-db "$RUNNER_TEMP/plugins.db"; then
            echo "remote install was not refused" >&2
            exit 1
          fi

      - name: Workspace and share pack stay offline and private
        run: |
          smcub share-pack --output "$RUNNER_TEMP/share-pack" --write > "$RUNNER_TEMP/share.json"
          python -c "import json; d=json.load(open('$RUNNER_TEMP/share.json')); assert d['upload'] is False, d; assert d['audit']['status']=='ok', d; assert d['data_origin']=='demo_fixture', d"
          smcub workspace summary --db "$RUNNER_TEMP/workspace.db"
