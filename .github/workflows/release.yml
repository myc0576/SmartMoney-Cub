name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      # Publish nothing that has not passed its own tests. This job used to build
      # and install a wheel and then release it, without ever running the suite:
      # CI runs on the same tag push but on its own schedule, so a tag could
      # publish while the tests were red or still running. The frontend is covered
      # here too, because the interface is a committed build that ships inside the
      # wheel and a tag is exactly when a stale one would reach users.
      - name: Install the test toolchain
        run: python -m pip install -e ".[dev,hosted]"

      - name: Run the test suite
        run: pytest -q

      - name: The safety contract must hold before anything is published
        run: |
          smcub doctor | tee "$RUNNER_TEMP/doctor.json"
          grep -q "READ_ONLY_NO_ORDER_NO_CANCEL_NO_TRADE" "$RUNNER_TEMP/doctor.json" || {
            echo "doctor does not carry the safety declaration; refusing to publish" >&2
            exit 1
          }
          python -c "
          import json
          d = json.load(open('$RUNNER_TEMP/doctor.json'))
          assert d['execution_integrations'] == 'disabled', d
          assert d['broker_api_required'] is False, d
          print('safety contract holds:', d['safety'])
          "

      - name: Verify tag matches package version
        env:
          PYTHONPATH: src
        run: >-
          python -c "import os; from smartmoney_cub_harness import __version__;
          expected = f'v{__version__}'; actual = os.environ['GITHUB_REF_NAME'];
          assert actual == expected, f'tag {actual!r} does not match {expected!r}'"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify built wheel installs
        run: |
          python -m pip install dist/*.whl
          smcub --version
          smcub doctor

      - name: Verify installed toy loop outside checkout
        run: |
          run_root="$(mktemp -d)"
          cd "${run_root}"
          smcub loop --preset toy --agent-trigger loop --json > loop-summary.json
          run_dir="$(python -c "import json; print(json.load(open('loop-summary.json'))['run_dir'])")"
          smcub inspect-artifacts "${run_dir}" > artifact-inspection.json
          python -c "import json; result=json.load(open('artifact-inspection.json')); assert result['status'] == 'ok', result"
          python -c "from pathlib import Path; text='\n'.join(p.read_text(encoding='utf-8', errors='replace') for p in Path('.').rglob('*') if p.is_file()); forbidden=('/home/', '/usr/', '/opt/', '/tmp/'); assert not any(item in text for item in forbidden), forbidden"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  npm-package:
    name: Build and verify the npm launcher package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify the launcher is syntactically valid
        run: node --check npm/bin/smartmoney-cub.js

      - name: Verify the npm version matches the package version
        run: |
          node -e "
            const pkg = require('./npm/package.json');
            const fs = require('fs');
            const init = fs.readFileSync('src/smartmoney_cub_harness/__init__.py', 'utf8');
            const match = /__version__ = \"([^\"]+)\"/.exec(init);
            if (!match || pkg.version !== match[1]) {
              console.error('npm version ' + pkg.version + ' does not match package version ' + (match && match[1]));
              process.exit(1);
            }
            console.log('npm version matches ' + pkg.version);
          "

      - name: Pack the npm package
        run: |
          cd npm
          npm pack --pack-destination "$RUNNER_TEMP/npm"

      - name: Upload the npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error


  github-release:
    name: Create GitHub Release
    needs: [build, npm-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Download the npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: npm-dist/

      - name: Create release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/* npm-dist/*.tgz
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
