name: Issue 27 final UI review
on:
  push:
    branches: [codex/settings-jev-assistant-27]
permissions:
  contents: write
jobs:
  review:
    if: github.repository == 'myc0576/SmartMoney-Cub' && github.ref == 'refs/heads/codex/settings-jev-assistant-27'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/settings-jev-assistant-27
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install verification dependencies
        run: |
          python -m pip install -e '.[dev]' crossplane pyyaml
          npm ci --prefix gui
          npm ci
          npx playwright install --with-deps chromium
      - name: Add stopped pending-tool regression and UI captures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/settings-connections.spec.ts')
          s = p.read_text()
          def edit(old, new, count=1):
              global s
              assert s.count(old) == count, old
              s = s.replace(old, new)
          edit('async ({ page }) => {', 'async ({ page }, testInfo) => {', 3)
          edit("  expect(probes).toBe(1);", "  expect(probes).toBe(1);\n  await page.screenshot({ path: testInfo.outputPath('jev-settings.png'), fullPage: true });")
          edit("            { kind: 'delta', text: '已收到的部分回复' },", "            { kind: 'tool_call', call_id: 'pending-call', name: 'toy_pending', arguments: '{}' },\n            { kind: 'delta', text: '已收到的部分回复' },")
          edit("  await expect(page.locator('.tool-card')).not.toHaveAttribute('open', '');", "  await expect(page.locator('.tool-card[open]')).toHaveCount(0);\n  await page.screenshot({ path: testInfo.outputPath('assistant-running.png'), fullPage: true });")
          edit('  expect(cancelled).toBe(1);', "  expect(cancelled).toBe(1);\n  await expect(page.locator('summary').filter({ hasText: 'toy_pending' })).toContainText('未返回结果');\n  await expect(page.getByText('（进行中）', { exact: true })).toHaveCount(0);\n  await page.screenshot({ path: testInfo.outputPath('assistant-stopped.png'), fullPage: true });")
          p.write_text(s)
          PY
          set +e
          npx playwright test e2e/settings-connections.spec.ts --grep 'IME' --project=chromium --retries=0
          code=$?
          set -e
          test "$code" -eq 1
      - name: Correct terminal labels at their source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gui/src/components/AssistantPanel.tsx')
          s = p.read_text()
          old = '（进行中）</span> : null}'
          new = "{busy && phase !== 'stopped' && !turn.error ? '（进行中）' : '（未返回结果）'}</span> : null}"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          p = Path('gui/src/components/AssistantRunStatus.tsx')
          s = p.read_text()
          old = 'running && calls === 0'
          assert s.count(old) == 1
          p.write_text(s.replace(old, "phase === 'connecting' && calls === 0"))
          PY
      - name: Verify final source and package
        run: |
          npm run typecheck --prefix gui
          npm test --prefix gui
          npm run build --prefix gui
          ./scripts/verify.sh
          npx playwright test e2e/settings-connections.spec.ts --project=chromium
      - name: Commit reviewed fix and remove temporary workflow
        run: |
          test "$(git branch --show-current)" = codex/settings-jev-assistant-27
          rm .github/workflows/issue27-final-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gui/src/components/AssistantPanel.tsx gui/src/components/AssistantRunStatus.tsx e2e/settings-connections.spec.ts src/smartmoney_cub_harness/workbench/web .github/workflows/issue27-final-review.yml
          git diff --cached --check
          git commit -m 'fix(assistant): distinguish stopped pending tools and validate final UI states'
          git push origin HEAD:refs/heads/codex/settings-jev-assistant-27
      - name: Upload final UI review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue27-final-ui-review
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
