name: Settings and assistant regression
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ux-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smcub
          POSTGRES_PASSWORD: smcub
          POSTGRES_DB: smcub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U smcub -d smcub_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SMARTMONEY_TEST_DATABASE_URL: postgresql://smcub:smcub@127.0.0.1:5432/smcub_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend and harness toolchains
        run: |
          python -m pip install -e '.[dev,hosted]' crossplane pyyaml
          npm ci
          npm ci --prefix gui
      - name: Run the repository verification gate
        shell: bash
        run: ./scripts/verify.sh | tee "$RUNNER_TEMP/harness-verification.txt"
      - name: Stream regression tests
        run: npm test --prefix gui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser interaction regression tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settings-assistant-regression
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/harness-verification.txt
          retention-days: 7
