name: Review workspace

on:
  push:
    branches: [codex/settings-assistant-cleanup]
    paths: [.github/workflows/review-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked UI and browser test toolchains
        run: |
          npm ci --prefix gui
          npm ci
      - name: Bundle tracked source and toolchains only
        run: |
          git archive --format=tar HEAD > "$RUNNER_TEMP/review-workspace.tar"
          tar -rf "$RUNNER_TEMP/review-workspace.tar" gui/node_modules node_modules
          gzip "$RUNNER_TEMP/review-workspace.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: review-workspace
          path: ${{ runner.temp }}/review-workspace.tar.gz
          retention-days: 1
